backend:
  name: git-gateway
  branch: main # or master, depending on your branch name

media_folder: "assets/uploads" # Where uploaded PDFs/images will be saved
public_folder: "assets/uploads"

collections:
  - name: "notices"
    label: "Notices"
    folder: "_notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "PDF Attachment / File", name: "file", widget: "file", required: false }
      - { label: "Notice Details", name: "body", widget: "markdown", required: false }
      

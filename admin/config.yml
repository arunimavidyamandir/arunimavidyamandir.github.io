backend:
  name: git-gateway
  branch: main
  site_domain: https://imaginative-monstera-a03b65.netlify.app/
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "notices"
    label: "Notices"
    folder: "_notices"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "PDF Attachment / File", name: "file", widget: "file", required: false }
      - { label: "Notice Details", name: "body", widget: "markdown", required: false }
      
